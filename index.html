<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Byte IA</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; height: 100vh; display: flex; overflow: hidden; }

  /* SIDEBAR */
  #sidebar {
    width: 260px; min-width: 180px; max-width: 400px;
    background: #fafafa; border-right: none;
    display: flex; flex-direction: column;
    position: relative; flex-shrink: 0;
  }
  #sidebar-header {
    padding: 18px 16px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  /* LOGO */
  .logo-wrap { display: flex; align-items: center; gap: 8px; }
  .logo-icon {
    width: 32px; height: 32px; position: relative;
  }
  .logo-icon svg { width: 32px; height: 32px; }
  .logo-text { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: #1a1a1a; }
  .logo-text span { color: #6c7aff; }

  #new-chat-btn {
    margin: 0 12px 12px;
    padding: 8px 14px; border-radius: 8px;
    background: #f0f0f0; border: none; cursor: pointer;
    font-size: 13px; color: #444; text-align: left;
    display: flex; align-items: center; gap: 6px;
  }
  #new-chat-btn:hover { background: #e8e8e8; }

  #conv-list { flex: 1; overflow-y: auto; padding: 0 8px; }
  .conv-item {
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .conv-item:hover { background: #efefef; }
  .conv-item.active { background: #e8e8ff; color: #3a3aff; }

  #sidebar-footer {
    padding: 12px; border-top: 1px solid #f0f0f0;
    position: relative;
  }
  #user-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 10px; cursor: pointer;
    border: none; background: transparent; width: 100%; text-align: left;
  }
  #user-btn:hover { background: #f0f0f0; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #6c7aff, #a78bfa);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: white; font-weight: 600; flex-shrink: 0;
  }
  .user-info { display: flex; flex-direction: column; }
  .user-name { font-size: 13px; font-weight: 600; color: #1a1a1a; }
  .user-plan { font-size: 11px; color: #888; }

  /* RESIZER */
  #resizer {
    width: 4px; background: transparent; cursor: col-resize;
    position: relative; flex-shrink: 0;
    transition: background 0.2s;
  }
  #resizer::after {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 1px; height: 100%;
    background: linear-gradient(to bottom, transparent 0%, #1a1a1a 30%, #1a1a1a 70%, transparent 100%);
    opacity: 0.15;
  }
  #resizer:hover::after, #resizer.dragging::after { opacity: 0.4; }

  /* MAIN */
  #main {
    flex: 1; display: flex; flex-direction: column; overflow: hidden;
    background: #fff;
  }
  #main-header {
    padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #f2f2f2;
  }
  #model-selector {
    padding: 6px 12px; border-radius: 8px; border: 1px solid #e0e0e0;
    font-size: 13px; color: #444; background: #fff; cursor: pointer;
    outline: none;
  }

  /* CHAT AREA */
  #chat-area {
    flex: 1; overflow-y: auto; padding: 24px 20px;
    display: flex; flex-direction: column; gap: 16px;
  }

  /* WELCOME */
  #welcome {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 28px; padding: 20px;
  }
  #welcome h1 { font-size: 26px; font-weight: 700; color: #1a1a1a; }
  .suggestions-grid {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 520px;
  }
  .suggestion-pill {
    padding: 7px 14px; border-radius: 50px;
    border: 1.5px solid #1a1a1a; background: transparent;
    font-size: 13px; color: #1a1a1a; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .suggestion-pill:hover { background: #1a1a1a; color: #fff; }

  /* MESSAGES */
  .msg { display: flex; gap: 10px; max-width: 720px; margin: 0 auto; width: 100%; }
  .msg.user { flex-direction: row-reverse; }
  .msg-bubble {
    padding: 11px 16px; border-radius: 14px; font-size: 14px; line-height: 1.55;
    max-width: 75%;
  }
  .msg.user .msg-bubble { background: #f4f4f6; border-radius: 14px; color: #1a1a1a; max-width: 75%; }
  .msg.ai .msg-bubble {
    background: #f4f4f6; color: #1a1a1a; border-bottom-left-radius: 4px;
  }
  .msg-bubble img { max-width: 100%; border-radius: 8px; margin-top: 6px; }
  .msg-bubble audio { margin-top: 8px; width: 100%; }

  /* LOADER */
  .loader-wrap { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  .dots-loader {
    width: 28px; height: 28px; position: relative;
  }
  .dots-loader span {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: #6c7aff;
    animation: orbit 1.2s linear infinite;
  }
  .dots-loader span:nth-child(1) { animation-delay: 0s; }
  .dots-loader span:nth-child(2) { animation-delay: -0.4s; }
  .dots-loader span:nth-child(3) { animation-delay: -0.8s; }
  @keyframes orbit {
    0%   { transform: rotate(0deg)   translateX(11px); opacity: 1; }
    50%  { opacity: 0.4; }
    100% { transform: rotate(360deg) translateX(11px); opacity: 1; }
  }
  .loader-text { font-size: 13px; color: #888; font-style: italic; }

  /* INPUT ZONE */
  #input-zone { padding: 14px 20px 18px; }
  #input-box {
    display: flex; align-items: flex-end; gap: 8px;
    border: 1.5px solid transparent;
    border-radius: 14px; padding: 10px 12px;
    background: linear-gradient(#fff, #fff) padding-box,
                linear-gradient(135deg, #6c7aff 0%, #a78bfa 50%, #60c7f5 100%) border-box;
    box-shadow: 0 0 18px rgba(108,122,255,0.12);
  }
  #input-actions-left { display: flex; align-items: center; gap: 4px; }
  .input-icon-btn {
    width: 32px; height: 32px; border-radius: 8px; border: none;
    background: transparent; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    color: #888; transition: color 0.15s, background 0.15s;
  }
  .input-icon-btn:hover { color: #6c7aff; background: #f0f0ff; }
  .input-icon-btn.recording { color: #ef4444; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  #msg-input {
    flex: 1; border: none; outline: none; resize: none;
    font-size: 14px; line-height: 1.5; max-height: 120px;
    font-family: inherit; color: #1a1a1a; background: transparent;
  }
  #msg-input::placeholder { color: #b0b0b0; }
  #send-btn {
    width: 34px; height: 34px; border-radius: 9px; border: none;
    background: linear-gradient(135deg, #6c7aff, #a78bfa);
    color: white; cursor: pointer; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: opacity 0.15s;
  }
  #send-btn:hover { opacity: 0.85; }

  /* IMAGE PREVIEW */
  #img-preview { margin-top: 6px; display: none; }
  #img-preview img { max-height: 80px; border-radius: 8px; }
  #img-preview button { background: none; border: none; cursor: pointer; font-size: 14px; color: #888; }

  /* AUTH MODAL */
  #auth-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  #auth-overlay.show { display: flex; }
  #auth-modal {
    background: #fff; border-radius: 16px; padding: 32px 28px;
    width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  }
  #auth-modal h2 { font-size: 20px; margin-bottom: 20px; color: #1a1a1a; }
  .auth-tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 1px solid #e8e8e8; }
  .auth-tab {
    padding: 8px 16px; cursor: pointer; font-size: 14px; color: #888;
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .auth-tab.active { color: #6c7aff; border-bottom-color: #6c7aff; font-weight: 600; }
  .auth-form { display: flex; flex-direction: column; gap: 12px; }
  .auth-form input {
    padding: 10px 14px; border: 1.5px solid #e0e0e0; border-radius: 9px;
    font-size: 14px; outline: none; transition: border-color 0.2s;
  }
  .auth-form input:focus { border-color: #6c7aff; }
  .auth-btn {
    padding: 11px; border-radius: 9px; border: none;
    background: linear-gradient(135deg, #6c7aff, #a78bfa);
    color: white; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .google-btn {
    padding: 11px; border-radius: 9px; border: 1.5px solid #e0e0e0;
    background: #fff; color: #444; font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .google-btn:hover { background: #f8f8f8; }
  .auth-link { font-size: 12px; color: #6c7aff; cursor: pointer; text-align: center; }
  .auth-error { font-size: 12px; color: #ef4444; text-align: center; min-height: 16px; }
  .auth-close { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: #aaa; }

  /* SCROLLBAR */
  #chat-area::-webkit-scrollbar { width: 4px; }
  #chat-area::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 4px; }
.streaming-cursor { display:inline-block; width:2px; height:16px; background:#6c7aff; margin-left:2px; vertical-align:middle; animation:blink .7s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
#main-header { display:none; }
</style>
</head>

<script>
const BACKEND = 'https://byteia-backend.onrender.com';
let conversations = JSON.parse(localStorage.getItem('byteConvs') || '[]');
let currentConvId = null;
let attachedImage = null;
let freeMessages = parseInt(localStorage.getItem('byteFreeMsgs') || '0');
const FREE_LIMIT = 5;
let recognition = null;
let isRecording = false;

// ---- CONVERSATIONS ----
function newConversation() {
  const id = Date.now().toString();
  conversations.unshift({ id, title: 'Nouvelle conversation', messages: [] });
  saveConvs();
  loadConversation(id);
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('chat-area').innerHTML = '';
  document.getElementById('chat-area').appendChild(document.getElementById('welcome'));
  document.getElementById('welcome').style.display = 'flex';
}

function loadConversation(id) {
  currentConvId = id;
  renderSidebar();
  const conv = conversations.find(c => c.id === id);
  if (!conv) return;
  const area = document.getElementById('chat-area');
  area.innerHTML = '';
  if (conv.messages.length === 0) {
    area.appendChild(buildWelcome());
    return;
  }
  conv.messages.forEach(m => area.appendChild(buildMsgEl(m.role, m.content)));
  area.scrollTop = area.scrollHeight;
}

function buildWelcome() {
  const w = document.getElementById('welcome');
  w.style.display = 'flex';
  return w;
}

function saveConvs() {
  localStorage.setItem('byteConvs', JSON.stringify(conversations.slice(0, 50)));
  renderSidebar();
}

function renderSidebar() {
  const list = document.getElementById('conv-list');
  list.innerHTML = '';
  conversations.forEach(c => {
    const el = document.createElement('div');
    el.className = 'conv-item' + (c.id === currentConvId ? ' active' : '');
    el.textContent = c.title;
    el.onclick = () => loadConversation(c.id);
    list.appendChild(el);
  });
}

// ---- MESSAGES ----
function buildMsgEl(role, content) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  if (typeof content === 'object' && content.type === 'image_url') {
    const img = document.createElement('img');
    img.src = content.url; img.alt = 'image gÃ©nÃ©rÃ©e';
    bubble.appendChild(img);
  } else if (typeof content === 'object' && content.type === 'audio_url') {
    const p = document.createElement('p');
    p.textContent = 'ðµ Musique gÃ©nÃ©rÃ©e';
    const audio = document.createElement('audio');
    audio.controls = true; audio.src = content.url;
    bubble.appendChild(p); bubble.appendChild(audio);
  } else {
    bubble.innerHTML = formatText(String(content));
  }
  wrap.appendChild(bubble);
  return wrap;
}

function formatText(text) {
  // Supprimer les astÃ©risques markdown
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
}

function appendMsg(role, content) {
  const area = document.getElementById('chat-area');
  // Enlever welcome si prÃ©sent
  const w = document.getElementById('welcome');
  if (w && w.parentNode === area) area.removeChild(w);
  const el = buildMsgEl(role, content);
  area.appendChild(el);
  area.scrollTop = area.scrollHeight;

  if (currentConvId) {
    const conv = conversations.find(c => c.id === currentConvId);
    if (conv) {
      conv.messages.push({ role, content });
      if (conv.messages.length === 2) {
        const firstMsg = conv.messages[0].content;
        conv.title = typeof firstMsg === 'string' ? firstMsg.slice(0, 38) : 'Conversation';
      }
      saveConvs();
    }
  }
}

function showLoader() {
  const area = document.getElementById('chat-area');
  const loader = document.createElement('div');
  loader.className = 'msg ai'; loader.id = 'msg-loader';
  loader.innerHTML = `<div class="loader-wrap"><div class="dots-loader"><span></span><span></span><span></span></div><span class="loader-text">Byte rÃ©flÃ©chitâ¦</span></div>`;
  area.appendChild(loader);
  area.scrollTop = area.scrollHeight;
}
function hideLoader() {
  const l = document.getElementById('msg-loader');
  if (l) l.remove();
}

// ---- SEND ----
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text && !attachedImage) return;

  // VÃ©rif limite gratuite
  if (!window._currentUser) {
    if (freeMessages >= FREE_LIMIT) { openAuth(); return; }
    freeMessages++;
    localStorage.setItem('byteFreeMsgs', freeMessages);
  }

  if (!currentConvId) {
    const id = Date.now().toString();
    conversations.unshift({ id, title: text.slice(0, 38) || 'Conversation', messages: [] });
    currentConvId = id;
    saveConvs();
  }

  const userContent = text;
  input.value = '';
  autoResize(input);

  // Construire message avec image si prÃ©sente
  let msgToSend = text;
  let imageData = null;
  if (attachedImage) {
    imageData = attachedImage;
    clearImage();
  }

  appendMsg('user', userContent);
  showLoader();

  const model = 'groq';
  const conv = conversations.find(c => c.id === currentConvId);
  const history = (conv?.messages || []).slice(-10).map(m => ({
    role: m.role === 'user' ? 'user' : 'assistant',
    content: typeof m.content === 'string' ? m.content : '[media]'
  }));

  // DÃ©tecter si l'utilisateur veut une image
  const wantsImage = /cr[Ã©e]{1,2}[^a-z]*image|gÃ©nÃ¨re[^a-z]*image|dessine|illustre/i.test(text);
  const wantsMusic = /gÃ©nÃ¨re[^a-z]*musique|crÃ©e[^a-z]*musique|compose[^a-z]*musique/i.test(text);

  try {
    if (wantsImage) {
      const res = await fetch(BACKEND + '/api/image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text })
      });
      const data = await res.json();
      hideLoader();
      if (data.url) appendMsg('ai', { type: 'image_url', url: data.url });
      else appendMsg('ai', data.error || 'Impossible de gÃ©nÃ©rer l\'image.');
    } else if (wantsMusic) {
      const res = await fetch(BACKEND + '/api/music', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text })
      });
      const data = await res.json();
      hideLoader();
      if (data.url) appendMsg('ai', { type: 'audio_url', url: data.url });
      else appendMsg('ai', data.error || 'Impossible de gÃ©nÃ©rer la musique pour l\'instant. Essayez plus tard.');
    } else {
      // Chat normal (streaming)
      const res = await fetch(BACKEND + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, model, history, imageData })
      });
      hideLoader();
      if (!res.ok) { appendMsg('ai', 'Erreur du serveur. RÃ©essayez.'); return; }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      const area = document.getElementById('chat-area');
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      const wrap = document.createElement('div');
      wrap.className = 'msg ai'; wrap.appendChild(bubble);
      area.appendChild(wrap);

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value);
        const lines = chunk.split('\n');
        for (const line of lines) {
          if (line.startsWith('data: ')) {
            const d = line.slice(6).trim();
            if (d === '[DONE]') break;
            try { const j = JSON.parse(d); if (j.text) { fullText += j.text; bubble.innerHTML = formatText(fullText); area.scrollTop = area.scrollHeight; } } catch(e){}
          }
        }
      }
      if (currentConvId) {
        const conv2 = conversations.find(c => c.id === currentConvId);
        if (conv2) { conv2.messages.push({ role: 'ai', content: fullText }); saveConvs(); }
      }
    }
  } catch(e) {
    hideLoader();
    appendMsg('ai', 'Erreur de connexion. VÃ©rifiez que le backend est en ligne.');
    console.error(e);
  }
}

function sendSuggestion(text) {
  document.getElementById('msg-input').value = text + ' ';
  document.getElementById('msg-input').focus();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ---- IMAGE ----
function handleImageSelect(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    attachedImage = e.target.result;
    document.getElementById('img-preview-img').src = attachedImage;
    document.getElementById('img-preview').style.display = 'flex';
    document.getElementById('img-preview').style.alignItems = 'center';
    document.getElementById('img-preview').style.gap = '8px';
  };
  reader.readAsDataURL(file);
}

function clearImage() {
  attachedImage = null;
  document.getElementById('img-preview').style.display = 'none';
  document.getElementById('img-input').value = '';
}

// Coller une image
document.addEventListener('paste', (e) => {
  const items = e.clipboardData?.items;
  if (!items) return;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      const reader = new FileReader();
      reader.onload = (ev) => {
        attachedImage = ev.target.result;
        document.getElementById('img-preview-img').src = attachedImage;
        document.getElementById('img-preview').style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }
  }
});

// ---- VOIX ----
function toggleVoice() {
  const btn = document.getElementById('mic-btn');
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert('La reconnaissance vocale n\'est pas supportÃ©e par ce navigateur.');
    return;
  }
  if (isRecording) {
    recognition?.stop();
    isRecording = false;
    btn.classList.remove('recording');
    btn.textContent = 'ð¤';
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'fr-FR';
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.onresult = (e) => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
    document.getElementById('msg-input').value = transcript;
    autoResize(document.getElementById('msg-input'));
    if (e.results[e.results.length - 1].isFinal) {
      isRecording = false; btn.classList.remove('recording'); btn.textContent = 'ð¤';
    }
  };
  recognition.onerror = () => { isRecording = false; btn.classList.remove('recording'); btn.textContent = 'ð¤'; };
  recognition.onend = () => { isRecording = false; btn.classList.remove('recording'); btn.textContent = 'ð¤'; };
  recognition.start();
  isRecording = true;
  btn.classList.add('recording');
  btn.textContent = 'ð´';
}

// ---- AUTH ----
let authTab = 'login';
function openAuth() { document.getElementById('auth-overlay').classList.add('show'); }
function closeAuth() { document.getElementById('auth-overlay').classList.remove('show'); }
function switchTab(tab) {
  authTab = tab;
  document.querySelectorAll('.auth-tab').forEach((t, i) => t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='signup')));
  document.getElementById('auth-submit-btn').textContent = tab === 'login' ? 'Se connecter' : 'CrÃ©er le compte';
  document.getElementById('forgot-link').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('auth-error').textContent = '';
}
async function submitAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Remplissez tous les champs.'; return; }
  try {
    if (authTab === 'login') await window._signInWithEmailAndPassword(window._auth, email, pass);
    else await window._createUserWithEmailAndPassword(window._auth, email, pass);
  } catch(e) {
    const msgs = { 'auth/wrong-password': 'Mot de passe incorrect.', 'auth/user-not-found': 'Compte introuvable.', 'auth/email-already-in-use': 'Email dÃ©jÃ  utilisÃ©.', 'auth/weak-password': 'Mot de passe trop faible.' };
    errEl.textContent = msgs[e.code] || e.message;
  }
}
async function signInGoogle() {
  try { await window._signInWithPopup(window._auth, window._provider); }
  catch(e) { document.getElementById('auth-error').textContent = e.message; }
}
async function forgotPassword() {
  const email = document.getElementById('auth-email').value.trim();
  if (!email) { document.getElementById('auth-error').textContent = 'Entrez votre email d\"abord.'; return; }
  try {
    await window._sendPasswordResetEmail(window._auth, email);
    document.getElementById('auth-error').style.color = '#22c55e';
    document.getElementById('auth-error').textContent = 'Email de rÃ©initialisation envoyÃ© !';
  } catch(e) { document.getElementById('auth-error').textContent = e.message; }
}

document.getElementById('user-btn').onclick = () => {
  if (window._currentUser) { if(confirm('Se dÃ©connecter ?')) window._signOut(window._auth); }
  else openAuth();
};
document.getElementById('new-chat-btn').onclick = newConversation;
document.getElementById('auth-overlay').onclick = (e) => { if(e.target === document.getElementById('auth-overlay')) closeAuth(); };

// ---- RESIZER ----
const resizer = document.getElementById('resizer');
const sidebar = document.getElementById('sidebar');
let isResizing = false;
resizer.addEventListener('mousedown', (e) => { isResizing = true; resizer.classList.add('dragging'); e.preventDefault(); });
document.addEventListener('mousemove', (e) => {
  if (!isResizing) return;
  const w = Math.min(400, Math.max(180, e.clientX));
  sidebar.style.width = w + 'px';
});
document.addEventListener('mouseup', () => { isResizing = false; resizer.classList.remove('dragging'); });

// INIT
renderSidebar();
if (conversations.length > 0) loadConversation(conversations[0].id);
</script>
