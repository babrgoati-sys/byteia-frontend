<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Byte IA</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0a0f1e"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0f1e;color:#e0e0e0;display:flex;height:100vh;overflow:hidden}
/* Sidebar */
#sidebar{position:relative;width:260px;background:#111827;display:flex;flex-direction:column;padding:12px;flex-shrink:0;border-right:1px solid #1f2937}
#logo{display:flex;align-items:center;gap:10px;padding:8px;margin-bottom:8px;font-size:18px;font-weight:700;color:#fff}
#logo span{background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:14px}
.sb-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:#9ca3af;font-size:14px;transition:.2s;border:none;background:none;width:100%;text-align:left}
.sb-btn:hover{background:#1f2937;color:#fff}
.sb-btn svg{width:16px;height:16px;flex-shrink:0}
#hist{flex:1;overflow-y:auto;margin:8px 0}
.hist-item{padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;color:#9ca3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.2s}
.hist-item:hover{background:#1f2937;color:#fff}
#user-area{border-top:1px solid #1f2937;padding-top:12px;margin-top:8px}
#user-btn{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;transition:.2s;border:none;background:none;width:100%;text-align:left;color:#e0e0e0}
#user-btn:hover{background:#1f2937}
#avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
#uinfo{flex:1;overflow:hidden}
#uname{font-size:13px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#usub{font-size:11px;color:#6b7280}
/* Main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #1f2937;flex-shrink:0}
#model-label{font-size:14px;color:#9ca3af;display:flex;align-items:center;gap:6px;cursor:pointer}
#model-label:hover{color:#fff}
#top-actions{display:flex;gap:8px}
.top-btn{padding:6px 14px;border-radius:20px;border:1px solid #374151;background:none;color:#9ca3af;font-size:13px;cursor:pointer;transition:.2s}
.top-btn:hover{background:#1f2937;color:#fff}
#messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
/* Welcome */
#welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:40px;text-align:center}
#welcome h1{font-size:28px;font-weight:700;margin-bottom:24px;background:linear-gradient(135deg,#6366f1,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#chat-input-wrap{padding:16px 20px;background:#111827;border-top:1px solid #1f2937;flex-shrink:0}
#input-box{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:12px 16px;display:flex;align-items:flex-end;gap:10px;transition:.2s}
#input-box:focus-within{border-color:#6366f1}
#msg-input{flex:1;background:none;border:none;outline:none;color:#e0e0e0;font-size:15px;resize:none;max-height:150px;line-height:1.5;font-family:inherit}
#msg-input::placeholder{color:#4b5563}
#send-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
#send-btn:hover{opacity:.9;transform:scale(1.05)}
#send-btn:disabled{opacity:.4;transform:none}
#send-btn svg{width:16px;height:16px;fill:#fff}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.sug-btn{padding:8px 16px;border-radius:20px;border:1px solid #374151;background:#111827;color:#9ca3af;font-size:13px;cursor:pointer;transition:.2s}
.sug-btn:hover{border-color:#6366f1;color:#a78bfa;background:#1f2937}
/* Messages */
.msg-row{display:flex;gap:12px;max-width:800px;width:100%;margin:0 auto}
.msg-row.user{flex-direction:row-reverse}
.msg-bubble{padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.6;white-space:pre-wrap;max-width:85%}
.msg-row.user .msg-bubble{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-bottom-right-radius:4px}
.msg-row.assistant .msg-bubble{background:#1f2937;color:#e0e0e0;border-bottom-left-radius:4px}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:4px}
.msg-row.user .msg-avatar{background:linear-gradient(135deg,#4f46e5,#7c3aed)}
.msg-row.assistant .msg-avatar{background:#374151}
/* Typing */
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#6366f1;margin:0 2px;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
/* Auth overlay */
#auth-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
#auth-overlay.open{display:flex}
#auth-modal{background:#111827;border:1px solid #374151;border-radius:20px;padding:32px;width:380px;max-width:90vw}
#auth-modal h2{font-size:22px;font-weight:700;text-align:center;margin-bottom:8px}
#auth-modal p{color:#9ca3af;text-align:center;font-size:14px;margin-bottom:24px}
.auth-tabs{display:flex;background:#1f2937;border-radius:10px;padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:8px;text-align:center;border-radius:7px;cursor:pointer;font-size:14px;color:#9ca3af;transition:.2s}
.auth-tab.active{background:#374151;color:#fff}
.form-field{margin-bottom:14px}
.form-field label{display:block;font-size:13px;color:#9ca3af;margin-bottom:6px}
.form-field input{width:100%;padding:10px 14px;background:#1f2937;border:1px solid #374151;border-radius:10px;color:#fff;font-size:14px;outline:none;transition:.2s}
.form-field input:focus{border-color:#6366f1}
.auth-btn-main{width:100%;padding:12px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:12px;transition:.2s}
.auth-btn-main:hover{opacity:.9}
.auth-divider{text-align:center;color:#4b5563;font-size:13px;margin:12px 0;position:relative}
.auth-divider::before,.auth-divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:#374151}
.auth-divider::before{left:0}.auth-divider::after{right:0}
.google-btn{width:100%;padding:10px;background:#1f2937;border:1px solid #374151;border-radius:10px;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s}
.google-btn:hover{background:#374151}
#auth-error{color:#ef4444;font-size:13px;text-align:center;margin-top:10px;min-height:18px}
#auth-close{position:absolute;top:16px;right:16px;background:none;border:none;color:#6b7280;font-size:20px;cursor:pointer}
#auth-modal{position:relative}
/* Provider badge */
#provider-badge{position:fixed;bottom:80px;right:16px;background:#1f2937;border:1px solid #374151;border-radius:8px;padding:4px 10px;font-size:11px;color:#6b7280;opacity:0;transition:.5s}
#provider-badge.show{opacity:1}
</style>
</head>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail, onAuthStateChanged, signOut, updateProfile } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyCcvUCvAJPPdx3lnJ3BC5ymOAta6YSFa94",
  authDomain: "byte-ia.firebaseapp.com",
  projectId: "byte-ia",
  storageBucket: "byte-ia.firebasestorage.app",
  messagingSenderId: "228226863785",
  appId: "1:228226863785:web:616c7212602f8c5e560fb8"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window._auth = auth;
window._provider = provider;
window._signInWithEmailAndPassword = signInWithEmailAndPassword;
window._createUserWithEmailAndPassword = createUserWithEmailAndPassword;
window._signInWithPopup = signInWithPopup;
window._sendPasswordResetEmail = sendPasswordResetEmail;
window._signOut = signOut;
window._updateProfile = updateProfile;

onAuthStateChanged(auth, user => {
  window._user = user;
  if (user) {
    document.getElementById('uname').textContent = user.displayName || user.email.split('@')[0];
    document.getElementById('usub').textContent = 'Connecté';
    document.getElementById('avatar').textContent = (user.displayName || user.email)[0].toUpperCase();
    document.getElementById('top-login-btn').textContent = 'Déconnexion';
    document.getElementById('top-login-btn').onclick = () => { window._signOut(auth); };
    document.getElementById('user-btn').onclick = () => { window._signOut(auth); };
    document.getElementById('usage-box').style.display = 'none';
    window._msgLimit = 999;
  } else {
    document.getElementById('uname').textContent = 'Se connecter';
    document.getElementById('usub').textContent = 'Accès illimité';
    document.getElementById('avatar').textContent = 'B';
    document.getElementById('top-login-btn').textContent = 'Se connecter';
    document.getElementById('top-login-btn').onclick = openAuth;
    document.getElementById('user-btn').onclick = openAuth;
    document.getElementById('usage-box').style.display = 'block';
    window._msgLimit = 3;
  }
});
</script>

<script>
const BACKEND = 'https://byteia-backend.onrender.com';
let history = [];
let msgCount = parseInt(localStorage.getItem('msgCount') || '0');
let activeTab = 'login';
window._msgLimit = 3;

// Init usage display
updateUsage();

function updateUsage() {
  const el = document.getElementById('usage-num');
  const bar = document.getElementById('usage-bar');
  if (el) el.textContent = msgCount + '/3';
  if (bar) bar.style.width = Math.min((msgCount/3)*100, 100) + '%';
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  
  if (!window._user && msgCount >= window._msgLimit) {
    openAuth(); return;
  }
  
  input.value = '';
  autoResize(input);
  
  // Show chat area
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('messages').style.display = 'flex';
  document.getElementById('messages').style.flexDirection = 'column';
  
  // User message
  history.push({ role: 'user', content: text });
  addMsg('user', text);
  
  // Loading
  const loadId = 'load' + Date.now();
  addTyping(loadId);
  
  document.getElementById('send-btn').disabled = true;
  
  try {
    const res = await fetch(BACKEND + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider: 'groq', messages: history, max_tokens: 2048 })
    });
    
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || 'Erreur: ' + (data.error || 'Réponse invalide');
    
    document.getElementById(loadId)?.remove();
    history.push({ role: 'assistant', content: reply });
    addMsg('assistant', reply);
    
    if (!window._user) {
      msgCount++;
      localStorage.setItem('msgCount', msgCount);
      updateUsage();
    }
    
    // Show provider badge
    const badge = document.getElementById('provider-badge');
    badge.classList.add('show');
    setTimeout(() => badge.classList.remove('show'), 3000);
    
  } catch(e) {
    document.getElementById(loadId)?.remove();
    addMsg('assistant', '⚠️ Erreur de connexion: ' + e.message + '\n\nVérifie que le backend est actif.');
  }
  
  document.getElementById('send-btn').disabled = false;
  
  // Add to history
  const hist = document.getElementById('hist');
  if (hist.children.length === 0) {
    const item = document.createElement('div');
    item.className = 'hist-item';
    item.textContent = text.substring(0, 40);
    hist.prepend(item);
  }
}

function addMsg(role, text) {
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'user' ? (window._user ? (window._user.displayName||window._user.email)[0].toUpperCase() : 'V') : 'B';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = text;
  row.appendChild(avatar);
  row.appendChild(bubble);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function addTyping(id) {
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.id = id;
  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = 'B';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  row.appendChild(avatar);
  row.appendChild(bubble);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
}

function useSug(text) {
  document.getElementById('msg-input').value = text + ' ';
  document.getElementById('msg-input').focus();
}

function newChat() {
  history = [];
  document.getElementById('messages').innerHTML = '';
  document.getElementById('messages').style.display = 'none';
  document.getElementById('welcome').style.display = 'flex';
}

// Auth
function openAuth() { document.getElementById('auth-overlay').classList.add('open'); }
function closeAuth() { document.getElementById('auth-overlay').classList.remove('open'); document.getElementById('auth-error').textContent = ''; document.getElementById('reset-msg').style.display='none'; }
function closeAuthBg(e) { if (e.target.id === 'auth-overlay') closeAuth(); }

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-signup').classList.toggle('active', tab==='signup');
  document.getElementById('field-name').style.display = tab==='signup' ? 'block' : 'none';
  document.getElementById('auth-submit-btn').textContent = tab==='login' ? 'Se connecter' : "S'inscrire";
  document.getElementById('forgot-link').style.display = tab==='login' ? 'block' : 'none';
  document.getElementById('auth-error').textContent = '';
}

async function doAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-pass').value;
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';
  if (!email || !pass) { errEl.textContent = 'Remplis tous les champs.'; return; }
  try {
    if (activeTab === 'login') {
      await window._signInWithEmailAndPassword(window._auth, email, pass);
    } else {
      const name = document.getElementById('auth-name').value.trim();
      const cred = await window._createUserWithEmailAndPassword(window._auth, email, pass);
      if (name) await window._updateProfile(cred.user, { displayName: name });
    }
    closeAuth();
  } catch(e) {
    const msgs = { 'auth/user-not-found':'Email introuvable.','auth/wrong-password':'Mot de passe incorrect.','auth/email-already-in-use':'Email déjà utilisé.','auth/weak-password':'Mot de passe trop court (6 car. min).' };
    errEl.textContent = msgs[e.code] || e.message;
  }
}

async function googleLogin() {
  try {
    await window._signInWithPopup(window._auth, window._provider);
    closeAuth();
  } catch(e) { document.getElementById('auth-error').textContent = e.message; }
}

async function resetPassword() {
  const email = document.getElementById('auth-email').value.trim();
  if (!email) { document.getElementById('auth-error').textContent = 'Entre ton email d\'abord.'; return; }
  try {
    await window._sendPasswordResetEmail(window._auth, email);
    document.getElementById('reset-msg').textContent = 'Email envoyé ! Vérifie ta boîte.';
    document.getElementById('reset-msg').style.display = 'block';
  } catch(e) { document.getElementById('auth-error').textContent = e.message; }
}
</script>

<script>
// Clean markdown asterisks
function cleanMd(t){
  return t.replace(/\*\*(.+?)\*\*/g,'$1').replace(/\*(.+?)\*/g,'$1')
    .replace(/^#{1,6}\s+/gm,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1')
    .replace(/^[-*]\s+/gm,'• ').trim();
}

// Spinning loader
function showLoader(){
  hideLoader();
  const msgs=document.getElementById('messages');
  const row=document.createElement('div');
  row.id='ld';
  row.style.cssText='display:flex;align-items:center;gap:12px;max-width:760px;width:100%;margin:0 auto;padding:6px 0';
  row.innerHTML='<div style="width:28px;height:28px;border-radius:50%;background:#f5f3ff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#818cf8;flex-shrink:0">B</div>'+
  '<div style="position:relative;width:30px;height:30px;flex-shrink:0;animation:lsp 1.1s linear infinite">'+
    '<div style="position:absolute;width:7px;height:7px;border-radius:50%;background:#818cf8;top:0;left:11px"></div>'+
    '<div style="position:absolute;width:7px;height:7px;border-radius:50%;background:#a78bfa;bottom:2px;right:2px"></div>'+
    '<div style="position:absolute;width:7px;height:7px;border-radius:50%;background:#c4b5fd;bottom:2px;left:2px"></div>'+
  '</div>'+
  '<span style="font-size:13px;color:#9ca3af;font-style:italic;animation:tp 1.5s ease-in-out infinite">Byte réfléchit…</span>';
  msgs.appendChild(row); msgs.scrollTop=msgs.scrollHeight;
  if(!document.getElementById('las')){
    const s=document.createElement('style');s.id='las';
    s.textContent='@keyframes lsp{to{transform:rotate(360deg)}}@keyframes tp{0%,100%{opacity:1}50%{opacity:.4}}';
    document.head.appendChild(s);
  }
}
function hideLoader(){const e=document.getElementById('ld');if(e)e.remove();}

// Override sendMessage to use cleanMd and loader
const _origSend = window.sendMessage;
window.sendMessage = async function(){
  const inp=document.getElementById('msg-input');
  const txt=inp.value.trim();
  if(!txt&&!window._attFile) return;
  inp.value=''; inp.style.height='auto';
  document.getElementById('welcome').style.display='none';
  const msgs=document.getElementById('messages');
  msgs.style.display='flex'; msgs.style.flexDirection='column';
  window._hist = window._hist||[];
  window._hist.push({role:'user',content:txt||'Image'});
  addMsgNew('user',txt,window._attDu);
  const fu=window._attDu; window._attFile=null; window._attDu=null;
  const ap=document.getElementById('att-prev'); if(ap)ap.style.display='none';
  showLoader();
  document.getElementById('send-btn').disabled=true;
  try{
    const res=await fetch('https://byteia-backend.onrender.com/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({provider:'groq',messages:window._hist,max_tokens:2048})
    });
    const data=await res.json();
    const reply=cleanMd(data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content||data.error||'Erreur.');
    hideLoader();
    window._hist.push({role:'assistant',content:reply});
    addMsgNew('assistant',reply);
  }catch(e){hideLoader();addMsgNew('assistant','Erreur: '+e.message);}
  document.getElementById('send-btn').disabled=false;
  const h=document.getElementById('hist');
  if(txt){const di=document.createElement('div');di.className='hist-item active';di.textContent=txt.substring(0,38);h.prepend(di);}
};

function addMsgNew(role,text,imgUrl){
  const msgs=document.getElementById('messages');
  const row=document.createElement('div'); row.className='msg-row '+role;
  const av=document.createElement('div'); av.className='msg-av';
  av.textContent=role==='user'?(window._user?(window._user.displayName||window._user.email)[0].toUpperCase():'V'):'B';
  const bubble=document.createElement('div'); bubble.className='msg-bubble';
  if(imgUrl){const img=document.createElement('img');img.src=imgUrl;img.style.cssText='max-width:200px;border-radius:10px;display:block;margin-bottom:4px';bubble.appendChild(img);}
  if(text){bubble.appendChild(document.createTextNode(text));}
  row.appendChild(av); row.appendChild(bubble);
  msgs.appendChild(row); msgs.scrollTop=msgs.scrollHeight;
}

// Image upload
function handleImg(inp){
  const f=inp.files[0]; if(!f) return;
  window._attFile=f;
  const rd=new FileReader();
  rd.onload=e=>{
    window._attDu=e.target.result;
    let p=document.getElementById('att-prev');
    if(!p){p=document.createElement('div');p.id='att-prev';p.style.cssText='display:flex;align-items:center;gap:6px;padding:4px 10px;background:#f5f3ff;border-radius:10px;font-size:11px;color:#7c3aed;margin-bottom:8px';
    p.innerHTML='<span id="att-name" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button onclick="window._attFile=null;window._attDu=null;this.parentElement.style.display=\'none\'" style="background:none;border:none;cursor:pointer;color:#9ca3af">✕</button>';
    document.getElementById('chat-input-area')||document.getElementById('chat-wrap').insertBefore(p,document.getElementById('input-box')||document.getElementById('input-outer'));}
    document.getElementById('att-name').textContent=f.name;
    p.style.display='flex';
  };
  rd.readAsDataURL(f); inp.value='';
}

// Resizable sidebar
function startResize(e){
  const sb=document.getElementById('sidebar');
  const sx=e.clientX,sw=sb.offsetWidth;
  function mv(e){sb.style.width=Math.min(Math.max(sw+(e.clientX-sx),120),340)+'px';}
  function up(){document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);}
  document.addEventListener('mousemove',mv);
  document.addEventListener('mouseup',up);
  e.preventDefault();
}
</script></body>
</html>
